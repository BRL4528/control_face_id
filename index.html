<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ponto Facial · Efrat</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{--bg:#0f1720;--surface:#182430;--surface2:#213141;--line:#2c3e50;
    --txt:#e8eef4;--muted:#8fa3b5;--ok:#3fb984;--warn:#e0a740;--bad:#e05a5a;--accent:#4a9de0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
  .hide{display:none!important}
  .nota{font-size:11.5px;color:var(--muted);line-height:1.55}
  .warnfg{color:var(--warn)} .badfg{color:var(--bad)} .okfg{color:var(--ok)}
  button{font-family:inherit}
  .act{width:100%;border:0;border-radius:11px;padding:14px;font-size:15px;font-weight:600;
    background:var(--accent);color:#fff;cursor:pointer;margin-top:8px}
  .act:disabled{background:var(--surface2);color:var(--muted)}
  .act.big{padding:20px;font-size:18px}
  .act.ghost{background:var(--surface2);color:var(--txt)}
  .act.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:12px;font-size:16px;margin-bottom:10px;font-family:inherit}
  label.lb{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;font-weight:600}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--surface2);
    border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:11px;
    font-size:13px;z-index:90;max-width:90%;text-align:center}
  .toast.ok{border-color:var(--ok)} .toast.warn{border-color:var(--warn)} .toast.bad{border-color:var(--bad)}

  /* ---------------- porta ---------------- */
  #porta{max-width:420px;margin:0 auto;padding:14vh 22px 40px;text-align:center}
  #porta h1{font-size:26px;margin:0 0 6px;font-weight:700}
  #porta .sub{color:var(--muted);font-size:13px;margin-bottom:38px}
  #porta .act{margin-bottom:12px}
  .parear{margin-top:34px;font-size:12px;color:var(--muted);background:none;border:0;
    text-decoration:underline;cursor:pointer;width:auto}

  /* ---------------- fila ---------------- */
  #fila header{display:flex;align-items:center;gap:10px;padding:12px 0}
  #fila header .quem{font-size:15px;font-weight:600}
  #fila header .eq{font-size:11px;color:var(--muted)}
  #fila header button{margin-left:auto;background:var(--surface2);border:0;color:var(--muted);
    border-radius:9px;padding:9px 13px;font-size:12px;cursor:pointer;width:auto}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
  .kpis div{background:var(--surface2);border-radius:9px;padding:10px 6px;text-align:center}
  .kpis .lab{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .kpis .val{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .camwrap{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:14px;
    overflow:hidden;margin-bottom:10px}
  video,canvas.ov{position:absolute;inset:0;width:100%;height:100%}
  video{object-fit:cover;transform:scaleX(-1)}
  canvas.ov{transform:scaleX(-1);pointer-events:none}
  .dica{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;
    background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:12px}
  .camoff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;text-align:center;padding:20px}
  .cartao{border-radius:13px;padding:15px;border:1px solid var(--line);background:var(--surface);margin-top:10px}
  .cartao.ok{background:rgba(63,185,132,.12);border-color:var(--ok)}
  .cartao.warn{background:rgba(224,167,64,.12);border-color:var(--warn)}
  .cartao .tit{font-size:18px;font-weight:700}
  .cartao .sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  .cartao .linha{display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .face{width:66px;height:66px;border-radius:13px;object-fit:cover;background:var(--surface2);
    transform:scaleX(-1);flex:none}
  .lista{max-height:44vh;overflow-y:auto;margin:8px 0}
  .lista button{width:100%;text-align:left;background:var(--surface2);border:0;color:var(--txt);
    padding:14px;border-radius:9px;margin-bottom:5px;font-size:15px;cursor:pointer}
  .tag{font-size:10px;background:var(--line);color:var(--muted);padding:2px 6px;border-radius:5px}

  /* ---------------- rh ---------------- */
  #rh header{display:flex;align-items:center;gap:10px;padding:12px 0}
  #rh header .quem{font-size:15px;font-weight:600}
  #rh header button{margin-left:auto;background:var(--surface2);border:0;color:var(--muted);
    border-radius:9px;padding:9px 13px;font-size:12px;cursor:pointer;width:auto}
  nav{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:11px;margin-bottom:14px;
    overflow-x:auto}
  nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 6px;
    border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  nav button.on{background:var(--surface2);color:var(--txt)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--surface2);border-radius:10px;padding:12px}
  .stat .lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .val{font-size:22px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .linha-item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
  .linha-item .nm{font-size:14px}
  .linha-item .mt{font-size:11px;color:var(--muted);margin-top:2px}
  .linha-item .dir{margin-left:auto;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
  .linha-item img{width:38px;height:38px;border-radius:9px;object-fit:cover;transform:scaleX(-1);flex:none}
  .ponto{width:9px;height:9px;border-radius:50%;flex:none}
  .ponto.ok{background:var(--ok)} .ponto.bad{background:var(--bad)} .ponto.muted{background:var(--muted)}
  .barra{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:5px}
  .barra i{display:block;height:100%;background:var(--warn)}
  .pend{border:1px solid var(--warn);background:rgba(224,167,64,.1);border-radius:11px;padding:12px;margin-bottom:10px}
  .pend .top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .pend .fotos{display:flex;gap:8px;margin:8px 0}
  .pend .fotos img{width:76px;height:76px;border-radius:9px;object-fit:cover;transform:scaleX(-1);background:var(--surface2)}
  .pend .fotos .vazio{width:76px;height:76px;border-radius:9px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
  .row2{display:flex;gap:8px} .row2>*{flex:1}
  .shots{display:flex;gap:7px;margin-bottom:10px}
  .shots div{flex:1;aspect-ratio:1;border-radius:9px;background:var(--surface2);
    border:1px dashed var(--line);overflow:hidden;display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:11px}
  .shots img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .esp{display:flex;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .esp .d{color:var(--muted);width:92px;flex:none;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<!-- ===================== PORTA ===================== -->
<div id="porta">
  <h1>Ponto Facial</h1>
  <div class="sub" id="portaSub">Efrat</div>
  <button class="act big" id="btnPonto">REGISTRAR PONTO</button>
  <button class="act ghost" id="btnAcessar">ACESSAR</button>
  <button class="parear" id="btnParear">Parear este aparelho</button>
  <p class="nota" id="portaStatus" style="margin-top:20px"></p>
</div>

<!-- ===================== FILA (gestor) ===================== -->
<div id="fila" class="wrap hide">
  <header>
    <div>
      <div class="quem" id="filaGestor">—</div>
      <div class="eq" id="filaEquipe">—</div>
    </div>
    <button id="btnSairFila">Encerrar</button>
  </header>

  <div class="kpis">
    <div><div class="lab">Marcaram</div><div class="val" id="kMarcaram">0/0</div></div>
    <div><div class="lab">Faltam</div><div class="val" id="kFaltam">0</div></div>
    <div><div class="lab">Na fila</div><div class="val" id="kEnvio">0</div></div>
  </div>

  <div class="camwrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas class="ov" id="overlay"></canvas>
    <div class="camoff hide" id="camOff">Câmera desligada</div>
    <div class="dica" id="dica"></div>
  </div>

  <div id="cartao"></div>
</div>

<!-- ===================== RH ===================== -->
<div id="rh" class="wrap hide">
  <header>
    <div>
      <div class="quem" id="rhNome">RH</div>
      <div class="eq" id="rhPeriodo">últimos 30 dias</div>
    </div>
    <button id="btnSairRh">Sair</button>
  </header>

  <nav>
    <button data-aba="painel" class="on">Painel</button>
    <button data-aba="pendencias">Pendências</button>
    <button data-aba="pessoas">Colaboradores</button>
    <button data-aba="equipes">Equipes</button>
    <button data-aba="registros">Registros</button>
  </nav>

  <section id="rh-painel"></section>
  <section id="rh-pendencias" class="hide"></section>
  <section id="rh-pessoas" class="hide"></section>
  <section id="rh-equipes" class="hide"></section>
  <section id="rh-registros" class="hide"></section>
</div>

<!-- ===================== LOGIN RH ===================== -->
<div id="loginRh" class="hide" style="max-width:380px;margin:0 auto;padding:12vh 22px 40px">
  <h1 style="font-size:22px;margin:0 0 4px">Acesso do RH</h1>
  <p class="nota" style="margin:0 0 26px">A senha não sai deste aparelho.</p>
  <label class="lb">Usuário</label>
  <input type="text" id="rhUsuario" autocomplete="username" autocapitalize="off" spellcheck="false">
  <label class="lb">Senha</label>
  <input type="password" id="rhSenha" autocomplete="current-password">
  <button class="act big" id="btnEntrarRh">Entrar</button>
  <button class="act ghost" id="btnVoltarPorta">Voltar</button>
</div>

<!-- ===================== PAREAMENTO ===================== -->
<div id="pareamento" class="hide" style="max-width:380px;margin:0 auto;padding:12vh 22px 40px">
  <h1 style="font-size:22px;margin:0 0 4px">Parear aparelho</h1>
  <p class="nota" style="margin:0 0 26px">Só uma vez. Depois disso o gestor nunca mais digita nada.</p>
  <label class="lb">Token do aparelho</label>
  <input type="text" id="tokenAparelho" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="act big" id="btnParearOk">Parear</button>
  <button class="act ghost" id="btnParearVoltar">Voltar</button>
</div>

<div id="toast" class="toast hide"></div>

<script src="./vendor/face-api.js"></script>
<script src="./js/config.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
