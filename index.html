<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceff4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ponto Facial · Efrat</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./css/fontes.css">
<link rel="stylesheet" href="./css/tema.css">
</head>
<body>

<!-- ===================== PORTA ===================== -->
<div id="porta">
  <h1>Ponto Facial</h1>
  <div class="sub" id="portaSub">Seu ponto, no seu celular</div>
  <button class="act big" id="btnPonto">REGISTRAR PONTO</button>
  <p class="nota" id="portaStatus" style="margin-top:20px"></p>
</div>

<!-- Acesso do RH: fora do rodízio exclusivo de mostrar(), sempre alcançável. -->
<button id="btnAcessar" class="hide">Acessar RH</button>

<!-- ===================== PAREAMENTO (primeira vez) ===================== -->
<div id="pareamento" class="hide" style="max-width:380px;margin:0 auto;padding:12vh 22px 40px">
  <h1 style="font-size:22px;margin:0 0 4px">Ativar meu ponto</h1>
  <p class="nota" style="margin:0 0 26px">Só na primeira vez. Depois é só olhar para a câmera.</p>
  <label class="lb">Código da empresa</label>
  <input type="text" id="pareEmpresa" autocapitalize="off" spellcheck="false" placeholder="fornecido pelo RH">
  <label class="lb">Sua matrícula</label>
  <input type="text" id="pareMatricula" autocapitalize="off" spellcheck="false">
  <button class="act big" id="btnParear">Ativar</button>
  <button class="act ghost" id="btnVoltarPorta">Voltar</button>
</div>

<!-- ===================== PONTO (painel do dia + câmera) ===================== -->
<div id="fila" class="wrap hide">
  <header>
    <button id="btnSairFila">Voltar</button>
    <div class="quem">Meu dia · <span id="quemFila"></span></div>
  </header>

  <!-- Painel do dia: os 4 pontos padrão. É o que aparece por padrão. -->
  <div id="painelDia"></div>

  <!-- Câmera: só aparece quando a pessoa toca para bater um ponto. -->
  <div id="areaCamera" class="hide">
    <div class="camwrap">
      <video id="video" playsinline muted autoplay></video>
      <canvas class="ov" id="overlay"></canvas>
      <div class="guia-oval" aria-hidden="true"></div>
      <div class="camoff hide" id="camOff">Câmera desligada</div>
      <div class="dica" id="dica"></div>
    </div>
    <p class="privacidade">Nenhuma imagem é armazenada, apenas o template biométrico</p>
    <button class="act ghost" id="btnFecharCamera">Cancelar</button>
  </div>

  <div id="cartao"></div>
</div>

<!-- ===================== RH ===================== -->
<div id="rh" class="wrap hide">
  <header>
    <div class="marca">Control Face ID</div>
    <div>
      <div class="quem" id="rhNome">RH</div>
      <div class="eq" id="rhPeriodo">últimos 30 dias</div>
    </div>
    <div class="toolbar">
      <div class="periodo" id="rhToggle">
        <button data-dias="7">7d</button>
        <button data-dias="30" class="on">30d</button>
        <button data-dias="90">90d</button>
      </div>
      <button id="btnAtualizarRh">Atualizar</button>
      <button id="btnSairRh">Sair</button>
    </div>
  </header>

  <nav>
    <button data-aba="painel" class="on">Painel</button>
    <button data-aba="alocacao">Alocação</button>
    <button data-aba="pendencias">Pendências</button>
    <button data-aba="pessoas">Colaboradores</button>
    <button data-aba="equipes">Equipes</button>
    <button data-aba="registros">Registros</button>
  </nav>

  <section id="rh-painel"></section>
  <section id="rh-alocacao" class="hide"></section>
  <section id="rh-pendencias" class="hide"></section>
  <section id="rh-pessoas" class="hide"></section>
  <section id="rh-equipes" class="hide"></section>
  <section id="rh-registros" class="hide"></section>
</div>

<!-- ===================== LOGIN RH ===================== -->
<div id="loginRh" class="hide" style="max-width:380px;margin:0 auto;padding:12vh 22px 40px">
  <h1 style="font-size:22px;margin:0 0 4px">Acesso do RH</h1>
  <p class="nota" style="margin:0 0 26px">A senha não sai deste aparelho.</p>
  <label class="lb">Usuário</label>
  <input type="text" id="rhUsuario" autocomplete="username" autocapitalize="off" spellcheck="false">
  <label class="lb">Senha</label>
  <input type="password" id="rhSenha" autocomplete="current-password">
  <button class="act big" id="btnEntrarRh">Entrar</button>
  <button class="act ghost" id="btnVoltarPortaRh">Voltar</button>
</div>

<div id="toast" class="toast hide"></div>

<script src="./vendor/face-api.js"></script>
<script src="./js/config.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
