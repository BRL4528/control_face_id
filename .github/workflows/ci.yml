name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unidade:
    name: Testes de regra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regras puras (sem navegador)
        run: node --test tests/unit/*.test.js

  fluxo:
    name: Fluxo ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Fluxo com câmera falsa e API simulada
        run: npx playwright test
        env:
          CI: 'true'
      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  higiene:
    name: Higiene do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # a guarda de versão do sw.js compara com a base
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sintaxe de todos os módulos
        run: for f in js/*.js tests/e2e/*.js; do node --check "$f" || exit 1; done

      - name: Nenhum segredo aparente no código versionado
        run: |
          if grep -rniE "(secret|api[_-]?key|bearer [a-z0-9]{16,}|ghp_[a-zA-Z0-9]{20,})" \
               --include="*.js" --include="*.html" --include="*.json" \
               js/ index.html manifest.json vercel.json; then
            echo "::error::possível segredo commitado"
            exit 1
          fi
          echo "nada encontrado"

      - name: O token do aparelho não pode estar no código
        run: |
          if grep -rn "TROQUE-ESTE-TOKEN\|TOKEN-TESTE" js/ index.html; then
            echo "::error::token de exemplo vazou para o código do app"
            exit 1
          fi
          echo "ok"

      - name: A versão do cache do sw.js descreve o conteúdo atual (T-C7A7E1)
        run: |
          # NAO compara com a base do push. Compara com o commit que FIXOU a
          # versao atual, e a pergunta e a certa: "a versao subiu depois da
          # ultima mudanca de conteudo?" — nao "a versao subiu neste intervalo?".
          #
          # A versao anterior desta guarda era de dois pontos e por isso cega ao
          # caso que mais acontece: a versao e bumpada no commit de integracao, e
          # o ramo que ja estava aberto tras conteudo novo em cima dela sem tocar
          # no numero. Num push com base antiga ela via v10 -> v12 e aprovava.
          # Isso aconteceu TRES vezes em um dia (v10, v11, v12) e as tres foram
          # achadas por inspecao manual, o que nao escala.
          #
          # Estrutural em ramo de vida longa, nao descuido: quem abriu o ramo
          # antes do bump nao tem como saber que precisa mexer no numero.
          v=$(grep -o "efrat-ponto-v[0-9]*" sw.js | head -1)
          test -n "$v" || { echo "::error::sw.js sem versão de cache"; exit 1; }
          echo "versão atual: $v"

          # O bump: o commit mais ANTIGO da sequência contígua em que a versão
          # já era $v. Andando do mais novo para trás enquanto a versão bate.
          bump=""
          for c in $(git log --format=%H -- sw.js); do
            vc=$(git show "$c:sw.js" 2>/dev/null | grep -o "efrat-ponto-v[0-9]*" | head -1)
            if [ "$vc" = "$v" ]; then bump="$c"; else break; fi
          done
          if [ -z "$bump" ]; then
            echo "::error::não achei o commit que fixou $v — sem isso a guarda não tem contra o que comparar, e prefiro falhar a passar calada"
            exit 1
          fi
          echo "versão $v fixada em: $(git log -1 --format='%h %s' "$bump")"

          # Impressão do que o sw.js pré-cacheia: caminho + hash de blob do git,
          # que já é hash de conteúdo. Pega mudança de LISTA e de CONTEÚDO.
          impressao() {
            git show "$1:sw.js" \
              | grep -oE "'\./[^']+'" | tr -d "'" | sed 's|^\./||' | sort -u \
              | while read -r p; do
                  printf '%s %s\n' "$p" "$(git rev-parse "$1:$p" 2>/dev/null || echo AUSENTE)"
                done
          }
          impressao "$bump" > /tmp/sw-bump.txt
          impressao HEAD     > /tmp/sw-head.txt

          if diff -q /tmp/sw-bump.txt /tmp/sw-head.txt >/dev/null; then
            echo "nada pré-cacheado mudou desde o bump — $v descreve o conteúdo atual"
            exit 0
          fi

          echo "mudou desde o bump de $v:"
          diff /tmp/sw-bump.txt /tmp/sw-head.txt | grep -E '^[<>]' | sed 's/^/  /'
          proxima=$(( ${v##*-v} + 1 ))
          echo "::error::o que o sw.js pré-cacheia mudou DEPOIS do commit que fixou $v — suba para efrat-ponto-v$proxima. Sem isso, aparelho com $v em disco continua servindo os arquivos antigos: não dá erro, o app simplesmente não muda"
          exit 1

      # A partir daqui: a página pública de cadastro de face (link enviado ao
      # celular do colaborador) vive fora do app do operador. Ela é um alvo
      # público, então cada regra que a isola tem uma guarda aqui.

      - name: O prefixo da página pública é o mesmo no sw.js, no _headers e no vercel.json
        run: |
          # Se alguém mudar o caminho da página em um lugar só, a isolação abre
          # um buraco silencioso: cache velho, ou precache dentro do app.
          prefixo=$(grep -oE "const FORA_DO_APP = '[^']+'" sw.js | sed "s/.*'\(.*\)'/\1/")
          test -n "$prefixo" || { echo "::error::sw.js sem FORA_DO_APP — o desvio da página pública desapareceu"; exit 1; }
          echo "prefixo da página pública: $prefixo"
          grep -qF "$prefixo" _headers    || { echo "::error::_headers não tem bloco para $prefixo"; exit 1; }
          grep -qF "$prefixo" vercel.json || { echo "::error::vercel.json não tem bloco para $prefixo"; exit 1; }

      - name: A página pública nunca é servida de cache
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const prefixo = fs.readFileSync("sw.js", "utf8").match(/const FORA_DO_APP = .([^"\x27]+)./)[1];
            const falhar = m => { console.error("::error::" + m); process.exit(1); };

            // _headers: os dois blocos (o clean URL e o prefixo) com no-store.
            const headers = fs.readFileSync("_headers", "utf8");
            for (const alvo of [prefixo, prefixo + "/*"]) {
              const bloco = headers.split(/\n(?=\S)/).find(b => b.trimStart().startsWith(alvo + "\n"));
              if (!bloco) falhar("_headers sem bloco " + alvo);
              if (!/Cache-Control:.*no-store/.test(bloco)) falhar("_headers: " + alvo + " tem de ser no-store");
              if (!/X-Robots-Tag:.*noindex/.test(bloco)) falhar("_headers: " + alvo + " tem de ser noindex — link público não entra em buscador");
            }

            // vercel.json: mesma coisa, senão produção divergiria do _headers.
            const vercel = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
            for (const fonte of [prefixo, prefixo + "/(.*)"]) {
              const regra = vercel.headers.find(h => h.source === fonte);
              if (!regra) falhar("vercel.json sem regra para " + fonte);
              const cc = regra.headers.find(h => h.key === "Cache-Control");
              if (!cc || !/no-store/.test(cc.value)) falhar("vercel.json: " + fonte + " tem de ser no-store");
            }

            // E os pesados continuam com cache longo — é o que faz o motor abrir
            // rápido no celular do colaborador.
            for (const alvo of ["/models/*", "/vendor/*"]) {
              const bloco = headers.split(/\n(?=\S)/).find(b => b.trimStart().startsWith(alvo + "\n"));
              if (!bloco || !/max-age=31536000.*immutable/.test(bloco)) falhar("_headers: " + alvo + " perdeu o cache longo");
            }
            console.log("cache da página pública e dos modelos: ok");
          '

      - name: O service worker do operador não alcança a página pública
        run: |
          # GUARDA DE RESULTADO, NAO DE MECANISMO. A versao anterior desta guarda
          # lia o TEXTO do handler e comparava a posicao de FORA_DO_APP com a de
          # respondWith. Medido: trocar a linha do desvio por
          # `if (false && (...)) return;` deixava a guarda VERDE com o desvio
          # morto. Ela conferia como a coisa e feita, quando o que importa e o
          # que sai.
          #
          # Agora executa o handler de verdade, com self/caches/location/fetch
          # dublados, e observa se respondWith FOI chamado. Qualquer refatoracao
          # que preserve o comportamento passa; qualquer uma que o quebre falha,
          # inclusive as que ninguem previu.
          node --input-type=module -e '
            import fs from "node:fs";
            const src = fs.readFileSync("sw.js", "utf8");
            const falhar = m => { console.error("::error::" + m); process.exit(1); };

            const ouvintes = {};
            const self = {
              addEventListener: (t, f) => { ouvintes[t] = f; },
              skipWaiting: () => {}, clients: { claim: () => {} }
            };
            const cacheDublado = { add: async () => {}, put: async () => {}, match: async () => undefined };
            const caches = {
              open: async () => cacheDublado, keys: async () => [],
              match: async () => undefined, delete: async () => {}
            };
            const location = { origin: "https://app.exemplo.test" };
            const fetch = async () => ({ ok: false, clone: () => ({}) });
            new Function("self", "caches", "location", "fetch", src)(self, caches, location, fetch);

            if (typeof ouvintes.fetch !== "function") falhar("sw.js nao registrou handler de fetch");

            // Chamou respondWith? Entao o service worker assumiu a resposta.
            const assumiu = (url, method = "GET") => {
              let r = false;
              ouvintes.fetch({ request: { method, url }, respondWith: () => { r = true; } });
              return r;
            };

            const orig = location.origin;
            const publicas = ["/publico", "/publico/", "/publico/index.html", "/publico/cadastro.js"];
            for (const p of publicas) {
              if (assumiu(orig + p)) {
                falhar("o service worker do operador ASSUMIU a resposta de " + p +
                  " — sem rede isso entrega o shell do app do operador ao colaborador, e um link de uso unico volta do cache");
              }
            }

            // Contraprova: se ele nao assumir NADA, a guarda acima passaria por
            // vacuidade e o app perderia o offline sem ninguem notar.
            const deveAssumir = ["/index.html", "/js/app.js", "/models/face_recognition_model.bin"];
            for (const p of deveAssumir) {
              if (!assumiu(orig + p)) falhar("o service worker deixou de assumir " + p + " — o app do operador perde o offline");
            }

            // E o que nunca foi dele: outra origem e nao-GET.
            if (assumiu("https://n8n.exemplo.test/webhook/efrat/marcacoes", "POST")) {
              falhar("o service worker assumiu um POST de API — resposta de marcacao em cache seria mentira sobre o que o servidor recebeu");
            }
            if (assumiu("https://n8n.exemplo.test/webhook/efrat/carga")) {
              falhar("o service worker assumiu GET de outra origem");
            }

            // O precache tambem nao pode conter a pagina publica.
            const prefixo = src.match(/const FORA_DO_APP = .([^"\x27]+)./);
            if (!prefixo) falhar("sw.js sem FORA_DO_APP — o desvio da pagina publica desapareceu");
            const assets = [...src.matchAll(/.(\.\/[^\x27"]+)./g)].map(m => m[1]);
            const dentro = assets.filter(a => a.replace(/^\./, "").startsWith(prefixo[1]));
            if (dentro.length) falhar("pagina publica no precache do sw.js: " + dentro.join(", "));

            console.log("handler executado: nao assume " + publicas.length + " caminhos publicos, assume " +
              deveAssumir.length + " do app, e ignora API e outra origem");
          '

      - name: Nenhum asset externo, fonte remota ou script de terceiro no que vai ao ar
        run: |
          # Mesma guarda que já impede a volta de CDN, agora sobre TODO arquivo
          # publicado — inclusive a página pública, que ainda não existe hoje e
          # por isso é o lugar mais fácil de alguém colar um <script src="...">.
          publicados=$(git ls-files '*.html' '*.js' '*.css' '*.json' \
            | grep -vE '^(vendor|models|tests|docs|n8n|\.central-agentes|\.github)/' \
            | grep -v '^package-lock\.json$')
          # publico/ entra de proposito: e a origem publica, o alvo mais exposto.
          echo "arquivos verificados:"; echo "$publicados" | sed 's/^/  /'

          proibidos='cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|ajax\.googleapis\.com|code\.jquery\.com|esm\.sh|skypack\.dev|googletagmanager\.com|google-analytics\.com'
          if grep -nEi "$proibidos" $publicados; then
            echo "::error::CDN, fonte remota ou script de terceiro em arquivo publicado"
            exit 1
          fi

          # Fora do apiBase (js/config.js) e do $schema do vercel.json, nenhum
          # arquivo publicado tem motivo para citar origem externa.
          sobra=$(grep -nE 'https?://' $publicados \
            | grep -v '^js/config\.js:' \
            | grep -v '^vercel\.json:' \
            | grep -v '^publico/vercel\.json:' || true)
          if [ -n "$sobra" ]; then
            echo "$sobra"
            echo "::error::origem externa em arquivo publicado — todo asset tem de ser local"
            exit 1
          fi
          echo "nenhum asset externo"

      - name: Nada no HTML inicial já satisfaz o que um spec espera
        run: |
          # Enquanto #porta nascia sem class="hide", qualquer spec que ESPERASSE
          # por ele passava pelo flash de um quadro entre o HTML inicial e a
          # decisão de verificarDispositivo() — passava mesmo com o resto
          # quebrado. E #btnPonto nascia sem `disabled`, e só irParaPorta()
          # (alcançável apenas com aparelho ATIVO) o desabilita: medido em
          # navegador, `toBeEnabled()` passava com aparelho pendente, aprovado e
          # antes de a página decidir qualquer coisa. Era o sinal de aceite de
          # aprovação de aparelho em 7 pontos de 6 specs, e não verificava nada.
          #
          # Assertiva NEGATIVA falharia com o flash; é a POSITIVA que passa por
          # engano. Por isso a correção é no HTML e não em cada spec: aqui a
          # classe inteira de defeito fecha de uma vez, e tela nova nascendo
          # visível também cai.
          node --input-type=module -e '
            import fs from "node:fs";
            const html = fs.readFileSync("index.html", "utf8");
            const falhas = [];

            const tagDe = id => {
              const i = html.indexOf("id=\"" + id + "\"");
              if (i < 0) return null;
              return html.slice(html.lastIndexOf("<", i), html.indexOf(">", i) + 1);
            };

            for (const id of ["porta", "aguardando", "fila", "rh", "loginRh"]) {
              const tag = tagDe(id);
              if (!tag) { falhas.push("a seção #" + id + " não existe no index.html"); continue; }
              const classe = (tag.match(/class="([^"]*)"/) || ["", ""])[1];
              if (!classe.split(/\s+/).includes("hide")) {
                falhas.push("a seção #" + id + " nasce VISÍVEL — spec que espera por ela passa pelo flash do boot mesmo com o app quebrado");
              }
            }

            const btn = tagDe("btnPonto");
            if (!btn) falhas.push("o botão #btnPonto não existe no index.html");
            else if (!/\sdisabled/.test(btn)) {
              falhas.push("#btnPonto nasce HABILITADO — toBeEnabled() passa com aparelho pendente, e é o sinal de aceite de aprovação em vários specs");
            }

            if (falhas.length) {
              for (const f of falhas) console.error("::error::" + f);
              process.exit(1);
            }
            console.log("nada no HTML inicial antecipa decisão do boot: 5 telas ocultas e o botão de ponto desabilitado");
          '

      - name: _headers e vercel.json declaram exatamente a mesma coisa
        run: |
          # Na Vercel o _headers NAO e lido: quem vale e o vercel.json. O repo
          # mantem os dois porque o _headers e a fonte legivel (e o servidor
          # falso do E2E le dele), mas isso significa que quem edita so o
          # _headers ACREDITA ter mudado producao e nao mudou.
          #
          # Por isso a comparacao e exaustiva por construcao, e nao uma lista de
          # cabecalhos que a gente lembrou de conferir: conjunto inteiro de
          # caminhos, e para cada caminho o dicionario inteiro de chave->valor.
          # Uma paridade que cobre so os cabecalhos de hoje fica verde no dia em
          # que alguem acrescenta o proximo e producao divergir.
          node --input-type=module -e '
            import fs from "node:fs";
            const falhas = [];

            // _headers: bloco por caminho, linhas indentadas sao cabecalhos.
            const doHeaders = {};
            let atual = null;
            for (const linha of fs.readFileSync("_headers", "utf8").split("\n")) {
              if (!linha.trim() || linha.trim().startsWith("#")) continue;
              if (!/^\s/.test(linha)) { atual = linha.trim(); doHeaders[atual] = {}; continue; }
              const sep = linha.indexOf(":");
              if (atual && sep > 0) doHeaders[atual][linha.slice(0, sep).trim()] = linha.slice(sep + 1).trim();
            }

            // vercel.json: source usa (.*) onde o _headers usa *.
            const canon = f => f.replace(/\(\.\*\)/g, "*");
            const doVercel = {};
            for (const regra of JSON.parse(fs.readFileSync("vercel.json", "utf8")).headers) {
              const chave = canon(regra.source);
              doVercel[chave] = doVercel[chave] || {};
              for (const h of regra.headers) doVercel[chave][h.key] = h.value;
            }

            const caminhos = [...new Set([...Object.keys(doHeaders), ...Object.keys(doVercel)])].sort();
            for (const c of caminhos) {
              if (!doHeaders[c]) { falhas.push("caminho " + c + " existe no vercel.json e nao no _headers"); continue; }
              if (!doVercel[c]) { falhas.push("caminho " + c + " existe no _headers e nao no vercel.json — editar so o _headers NAO muda producao"); continue; }
              const chaves = [...new Set([...Object.keys(doHeaders[c]), ...Object.keys(doVercel[c])])].sort();
              for (const k of chaves) {
                const a = doHeaders[c][k], b = doVercel[c][k];
                if (a === undefined) falhas.push(c + ": " + k + " so no vercel.json");
                else if (b === undefined) falhas.push(c + ": " + k + " so no _headers — nao chega em producao");
                else if (a !== b) falhas.push(c + ": " + k + " divergente\n      _headers:    " + a + "\n      vercel.json: " + b);
              }
            }

            if (falhas.length) {
              for (const f of falhas) console.error("::error::paridade _headers x vercel.json — " + f);
              process.exit(1);
            }
            const n = caminhos.reduce((s, c) => s + Object.keys(doHeaders[c]).length, 0);
            console.log("paridade exaustiva ok: " + caminhos.length + " caminhos, " + n + " cabecalhos, nenhuma divergencia");
          '

      - name: A origem pública é isolada por ausência do arquivo, não por rota
        run: |
          # A pagina publica roda em projeto separado da Vercel (Root Directory
          # publico/). Se ela for publicada junto com o app, volta a estar na
          # MESMA ORIGEM e le o IndexedDB 'efrat-ponto' — a credencial de 256
          # bits do aparelho. .vercelignore e o que garante a ausencia.
          test -f .vercelignore || { echo "::error::.vercelignore desapareceu — publico/ voltaria para o deploy do app"; exit 1; }
          grep -qE '^publico/?$' .vercelignore || {
            echo "::error::.vercelignore nao exclui publico/ — a pagina publica seria servida na origem do app"; exit 1; }
          echo ".vercelignore exclui publico/ do deploy do app"

      - name: A origem pública não carrega nada de fora e não registra service worker
        run: |
          test -d publico || { echo "::error::publico/ nao existe — a origem publica perdeu o Root Directory"; exit 1; }

          # Nenhuma origem externa. vercel.json e LEIA-ME.md sao excecao: um
          # declara a CSP (que cita o apiBase), o outro e documentacao.
          if grep -rnE 'https?://' publico/ --include='*.html' --include='*.js' --include='*.css'; then
            echo "::error::a origem publica nao pode citar origem externa — motor, fontes e modelos vem do build"
            exit 1
          fi

          # Nenhum service worker: seria o fallback-para-shell de volta, agora
          # na origem que menos precisa dele.
          if grep -rnE 'serviceWorker|navigator\.serviceWorker|sw\.js' publico/ --include='*.html' --include='*.js'; then
            echo "::error::a origem publica nao pode registrar service worker — pagina de uso unico nao ganha nada com offline"
            exit 1
          fi

          # Nenhuma copia commitada dos pesados: fonte de verdade e ../vendor e
          # ../models, copiados no build.
          if git ls-files publico/ | grep -qE '^publico/(vendor|models)/'; then
            echo "::error::copia commitada de vendor/ ou models/ em publico/ — duas fontes de verdade"
            exit 1
          fi
          echo "origem publica: sem asset externo, sem service worker, sem copia commitada"

      - name: A política da origem pública fecha cache, indexação e terceiros
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const falhar = m => { console.error("::error::" + m); process.exit(1); };
            const cfg = JSON.parse(fs.readFileSync("publico/vercel.json", "utf8"));

            if (cfg.buildCommand !== "bash ./copiar-assets.sh") falhar("publico/vercel.json perdeu o buildCommand que copia vendor/ e models/");
            if (cfg.outputDirectory !== "dist") falhar("publico/vercel.json perdeu o outputDirectory dist");

            const regra = f => cfg.headers.find(h => h.source === f);
            const valor = (f, k) => (regra(f)?.headers || []).find(h => h.key === k)?.value || "";

            // A pagina de uso unico: nunca de cache, nunca indexada.
            for (const fonte of ["/", "/index.html"]) {
              if (!/no-store/.test(valor(fonte, "Cache-Control"))) falhar("publico/vercel.json: " + fonte + " tem de ser no-store");
              if (!/noindex/.test(valor(fonte, "X-Robots-Tag"))) falhar("publico/vercel.json: " + fonte + " tem de ser noindex");
            }
            // Os pesados seguem imutaveis — e o que faz o motor abrir rapido.
            for (const fonte of ["/vendor/(.*)", "/models/(.*)"]) {
              if (!/max-age=31536000.*immutable/.test(valor(fonte, "Cache-Control"))) falhar("publico/vercel.json: " + fonte + " perdeu o cache longo");
            }

            // A CSP da origem publica e propria e nao pode abrir para terceiro.
            const csp = valor("/(.*)", "Content-Security-Policy");
            if (!csp) falhar("publico/vercel.json sem Content-Security-Policy");
            for (const d of ["default-src \x27self\x27", "script-src \x27self\x27", "font-src \x27self\x27", "frame-ancestors \x27none\x27"]) {
              if (!csp.includes(d)) falhar("a CSP da origem publica precisa de " + d);
            }
            // O unico host externo tolerado e o apiBase do app.
            const externos = [...csp.matchAll(/https?:\/\/[^\s;]+/g)].map(m => m[0]);
            const apiBase = fs.readFileSync("js/config.js", "utf8").match(/apiBase:\s*.(https?:\/\/[^\/\x27"]+)/)[1];
            for (const h of externos) {
              if (!h.startsWith(apiBase)) falhar("a CSP da origem publica libera host que nao e o apiBase: " + h);
            }
            if (!externos.length) falhar("a CSP da origem publica nao libera o apiBase — a pagina nao gravaria face nenhuma");
            console.log("origem publica: cache, indexacao e CSP conferidos (apiBase " + apiBase + ")");
          '

      - name: O servidor de teste realmente ENVIA a política do _headers
        run: |
          # A paridade acima compara arquivo com arquivo. Esta compara o que sai
          # NA RESPOSTA com o que o _headers manda — e a unica que prova que o
          # E2E roda sob a politica de producao e nao sob nenhuma.
          #
          # A lacuna que ela fecha: o teste unitario de CSP chama
          # extrairCspDeHeaders(), que e funcao pura lendo o arquivo. Se o
          # servidor falso parar de APLICAR os cabecalhos, aquele teste continua
          # verde e o E2E passa a validar uma politica que nao existe. Nada
          # pegava isso.
          #
          # Compara contra o _headers lido aqui, de proposito: nao importa como
          # o servidor implementa, importa que a resposta case com o arquivo.
          node --input-type=module -e '
            import fs from "node:fs";
            import { subir } from "./tests/e2e/servidor-falso.js";

            const blocos = [];
            let atual = null;
            for (const linha of fs.readFileSync("_headers", "utf8").split("\n")) {
              if (!linha.trim() || linha.trim().startsWith("#")) continue;
              if (!/^\s/.test(linha)) { atual = { padrao: linha.trim(), h: {} }; blocos.push(atual); continue; }
              const s = linha.indexOf(":");
              if (atual && s > 0) atual.h[linha.slice(0, s).trim().toLowerCase()] = linha.slice(s + 1).trim();
            }
            const esperado = p => {
              const out = {};
              for (const b of blocos) {
                const re = new RegExp("^" + b.padrao.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
                if (re.test(p)) Object.assign(out, b.h);
              }
              return out;
            };

            const ALVOS = ["/index.html", "/js/app.js", "/sw.js",
                           "/models/tiny_face_detector_model.bin", "/vendor/face-api.js"];
            const { url, servidor } = await subir();
            const falhas = [];
            for (const p of ALVOS) {
              const r = await fetch(url + p);
              if (!r.ok) { falhas.push(p + " respondeu " + r.status); continue; }
              const quer = esperado(p);
              if (!Object.keys(quer).length) { falhas.push(p + " nao casa com nenhum bloco do _headers"); continue; }
              for (const [k, v] of Object.entries(quer)) {
                const recebido = r.headers.get(k);
                if (recebido === null) falhas.push(p + ": nao enviou " + k + " (o _headers manda \"" + v + "\")");
                else if (recebido !== v) falhas.push(p + ": " + k + " enviado \"" + recebido + "\", _headers manda \"" + v + "\"");
              }
            }
            servidor.close();

            if (falhas.length) {
              for (const f of falhas) console.error("::error::servidor de teste x _headers — " + f);
              console.error("::error::o E2E estaria rodando sob politica diferente da de producao");
              process.exit(1);
            }
            console.log("servidor de teste envia a politica do _headers em " + ALVOS.length + " caminhos conferidos");
          '

      - name: Nenhum cabeçalho de teste escapa para fora de tests/
        run: |
          # Pedido do T-C20AD3. O servidor falso precisa simular o IP de origem
          # para tornar testavel o pedidos_da_mesma_rede_1h (§1.2), e o jeito
          # obvio e um cabecalho so-de-teste. O risco, que ja aconteceu nesta
          # base com o campo coerencia: o servidor falso e o modelo que alguem
          # usa para escrever o workflow real do n8n. Se o cabecalho for
          # copiado para la, nasce falsificacao de origem — qualquer requisicao
          # externa manda o cabecalho e o sinal que existe para DETECTAR flood
          # passa a ser o que o atacante escolher, inclusive variando o valor
          # para se esconder do proprio sinal.
          #
          # Casa por PADRAO e nao por um nome so: qualquer cabecalho marcado
          # como teste/fake/mock. Assim vale para o nome que o T-C20AD3
          # escolher e para o proximo que alguem inventar.
          #
          # tests/ e onde ele PODE existir. .github/ esta fora porque este
          # arquivo cita o padrao. vendor/ e models/ sao terceiros e binarios.
          alvos=$(git ls-files | grep -vE '^(tests|vendor|models|\.github)/' || true)
          if [ -z "$alvos" ]; then echo "::error::nenhum arquivo para varrer — a guarda ficaria sem efeito"; exit 1; fi

          achados=$(grep -niE 'x-(teste|test|fake|falso|mock|dev)-' $alvos || true)
          if [ -n "$achados" ]; then
            echo "$achados"
            echo "::error::cabeçalho de teste fora de tests/ — se isto chegar ao workflow do n8n, a origem da requisição passa a ser escolhida por quem chama, e o sinal de flood vira decoração"
            exit 1
          fi
          echo "nenhum cabeçalho de teste fora de tests/ ($(echo "$alvos" | wc -l) arquivos varridos)"

      - name: npm run serve nunca aponta para produção (T-B1D7F6)
        run: |
          node --input-type=module -e '
            import { subir } from "./tests/e2e/servidor-falso.js";
            const { url, servidor } = await subir();
            const src = await (await fetch(url + "/js/config.js")).text();
            servidor.close();

            // Avalia o config exatamente como o navegador faria, sem override.
            const window = {};
            new Function("window", src)(window);
            const servida = new URL(window.EFRAT_CFG.apiBase).host;
            const local = new URL(url).host;
            if (servida !== local) {
              console.error("::error::o servidor de teste entrega o app apontando para " + servida +
                " — npm run serve registraria aparelho e bateria ponto em produção");
              process.exit(1);
            }

            // E o override que os specs injetam continua vencendo.
            const comOverride = { EFRAT_CFG: { apiBase: "http://127.0.0.1:1/webhook" } };
            new Function("window", src)(comOverride);
            if (comOverride.EFRAT_CFG.apiBase !== "http://127.0.0.1:1/webhook") {
              console.error("::error::o servidor de teste atropela a apiBase injetada pelos specs");
              process.exit(1);
            }
            console.log("npm run serve -> " + servida + " (local), override de spec preservado");
          '
